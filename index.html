<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Nosso Contador <3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>Olá meu amor</h1>
        <p>Só uma lembrancinha pra você</p>
        <button id="btn-entrar">Clique aqui</button>

    <section id="tela-conteudo" class="escondido">
        <h1>Contador</h1>
        <p>Criado por João Pedro</p>
        <div class="galeria">
            <img src="images/Foto_2.jpg" alt="Fotinho nossa 1">
            <img src="images/fototeste1.jpg" alt="Fotinho nossa 2">
            <img src="images/fototeste2.jpg" alt="Fotinho nossa 3">
            <img src="images/foto_1.jpg" alt="Fotinho nossa 4">
        </div>
        <div id="contador"></div>
        <br><br>
        <button id="btn-voltar">Voltar para o Início</button>
    </section>
    <script src="script.js"></script>
</body>
</html>
